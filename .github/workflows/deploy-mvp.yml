name: Deploy MVP

# Publishes mvp/ to GitHub Pages.
#
# GitHub Pages rather than Vercel deliberately: no third-party account, no deploy token, nothing to
# configure outside this repo. The app runs entirely client-side on the agent's deterministic path,
# so a static host is sufficient and the demo cannot be broken by an API quota.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [claude/category-exploration-discovery-q5hqgb]
    paths:
      - "mvp/**"
      - ".github/workflows/deploy-mvp.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the agent still passes its evals before shipping
        run: node mvp/evals/run.mjs

      # LLM writes the card copy here, in CI, where the key is a secret. The published site is
      # static and cannot hold a key, so without this step the demo would only ever show the
      # deterministic fallback and understate what the agent actually does.
      # All three keys, first available wins (free providers first). Previously only Anthropic was
      # passed, so once that balance emptied every redeploy would have silently shipped
      # deterministic-only copy — the site would still work, but the demo would stop showing what
      # the agent actually writes, which is the entire reason this step exists.
      - name: Pre-generate LLM card copy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node mvp/scripts/pregenerate-copy.mjs

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r mvp/index.html mvp/main.js mvp/agent mvp/data _site/
          ls -la _site/data/llm-copy.json || echo 'no llm-copy.json — site will use deterministic copy'
          # Pages serves 404.html for unknown paths; point it at the app so deep links work.
          cp mvp/index.html _site/404.html
          echo "Staged:" && find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report URL
        run: |
          echo "### MVP deployed" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
