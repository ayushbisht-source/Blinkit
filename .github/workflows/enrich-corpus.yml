name: Enrich corpus

# Runs the two-stage LLM enrichment on the collected corpus and commits the results.
#
# Requires ONE of these repository secrets (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEY      free tier, aistudio.google.com/apikey
#   ANTHROPIC_API_KEY   paid, console.anthropic.com
# The client auto-detects whichever is present.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap documents (0 = all). Use a small number for a cheap trial run first."
        required: false
        default: "0"
      stage:
        description: "relevance | extraction | all"
        required: false
        default: "all"
      list_models:
        description: "true: only print this key's Gemini model catalog (no generation calls, no quota spent), then exit"
        required: false
        default: "false"
      probe_models:
        description: "true: try one tiny call per model and report which are actually usable, then exit"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # long: thousands of API calls, and resumable if it times out

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install anthropic google-genai pydantic python-dotenv tenacity

      - name: Check credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No API key. Add GEMINI_API_KEY (free: aistudio.google.com/apikey) or ANTHROPIC_API_KEY as a repository secret."
            exit 1
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Provider will be: ANTHROPIC (paid, fast)"
          else
            echo "::warning::ANTHROPIC_API_KEY not set — falling back to GEMINI free tier. Expect this run to be 5-10x slower."
            echo "Provider will be: GEMINI (free tier)"
          fi

      # Metadata call only — no generation quota spent. Run this first whenever the model
      # situation is unclear rather than burning generation attempts to find out by guessing.
      - name: List Gemini models
        if: github.event.inputs.list_models == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "### Gemini model catalog" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m engine.pipeline.enrich --list-models | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Answers "is the free tier viable at all" empirically: quota is enforced per model, so the
      # real daily budget is (working models x per-model cap), not one shared pool.
      - name: Probe Gemini models
        if: github.event.inputs.probe_models == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m engine.pipeline.enrich --probe-models

      # One live call before committing to thousands. A bad model name or a dead key fails here
      # with a readable traceback instead of quietly producing an empty output file.
      - name: Self-test
        if: github.event.inputs.list_models != 'true' && github.event.inputs.probe_models != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m engine.pipeline.enrich --selftest

      - name: Enrich
        if: github.event.inputs.list_models != 'true' && github.event.inputs.probe_models != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m engine.pipeline.enrich \
            --stage "${{ github.event.inputs.stage }}" \
            --limit "${{ github.event.inputs.limit }}"

      - name: Summarise
        if: always() && github.event.inputs.list_models != 'true' && github.event.inputs.probe_models != 'true'
        run: |
          echo "### Enrichment" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in data/interim/relevance.jsonl data/interim/extractions.jsonl; do
            [ -f "$f" ] && wc -l "$f" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY

      # always() so a timeout still commits the partial work — the next run resumes from it
      # instead of paying for those documents twice.
      #
      # Same reset-onto-remote pattern as analyse.yml, and for the same reason: these are generated
      # artifacts. Rebasing them onto a concurrently-pushed version of themselves conflicts with
      # nothing to resolve, and it cost one completed analysis run before it was fixed there.
      - name: Commit results
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin ${{ github.ref_name }}
          git reset --mixed FETCH_HEAD
          git add -f data/interim/relevance.jsonl data/interim/extractions.jsonl 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Enrich corpus via Actions run ${{ github.run_number }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
