name: Collect app stores

# Widens the corpus without leaving the sources that actually work.
#
# Reddit is unavailable: the public .json endpoints return HTTP 403 on every request from a CI
# runner (Reddit blocks datacenter IPs for anonymous reads) and the authenticated path needs
# credentials this project does not have. Rather than claim a source that produced nothing, this
# job deepens the ones that do — more apps, and many more languages.
#
# --append merges with the existing corpus and de-duplicates across the combined set, so re-running
# is safe and previously collected documents are never lost.

on:
  workflow_dispatch:
    inputs:
      per_app:
        description: 'Target reviews per app'
        required: false
        default: '600'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Corpus before
        run: |
          wc -l data/interim/documents.jsonl || echo "(none)"
          python - <<'PY'
          import json, collections, pathlib
          p = pathlib.Path("data/interim/documents.jsonl")
          if p.exists():
              c = collections.Counter(json.loads(l)["source"] for l in p.open() if l.strip())
              print("by source:", dict(c))
          PY

      - name: Collect and merge
        run: |
          python -m engine.collect \
            --sources play_store,app_store \
            --per-app ${{ github.event.inputs.per_app || '600' }} \
            --append

      - name: Corpus after
        run: |
          wc -l data/interim/documents.jsonl
          python - <<'PY'
          import json, collections, pathlib
          rows = [json.loads(l) for l in pathlib.Path("data/interim/documents.jsonl").open() if l.strip()]
          print("by source:", dict(collections.Counter(r["source"] for r in rows)))
          print("by app:   ", dict(collections.Counter(r.get("app_or_community") for r in rows)))
          print("by lang:  ", dict(collections.Counter(r.get("lang") for r in rows)))
          PY

      - name: Commit corpus
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }}
          git reset --mixed FETCH_HEAD
          git add data/raw data/interim/documents.jsonl
          if git diff --cached --quiet; then
            echo "No new documents."
            exit 0
          fi
          git commit -m "Widen the corpus: more apps and languages"
          git push origin HEAD:${{ github.ref_name }}
