name: Analyse corpus

# Runs everything downstream of extraction: cluster -> synthesize -> validate -> regenerate the
# Part 1 write-up, then commits the outputs.
#
# Split from enrich-corpus.yml because enrichment takes ~40 minutes and this takes ~2. Re-running
# the analysis after a threshold change should not mean paying for extraction again.
#
# Only `synthesize` needs an API key. Clustering, validation and the report are deterministic and
# run on committed artifacts, so a key outage degrades this to "no insight prose" rather than
# "no analysis".
on:
  workflow_dispatch:
    inputs:
      merge_at:
        description: "Centroid-merge threshold. Blank uses the calibrated default (0.35)."
        required: false
        default: ""
      calibrate:
        description: "true: print the merge-threshold sweep before clustering"
        required: false
        default: "false"
      skip_synthesis:
        description: "true: skip the one LLM stage and run the deterministic pipeline only"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show what we are working from
        run: |
          echo "### Inputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          wc -l data/interim/*.jsonl >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Reproduces the table that justifies the merge threshold. Cheap, no API calls, and the
      # reason the chosen value is a measurement rather than a preference.
      - name: Calibrate merge threshold
        if: github.event.inputs.calibrate == 'true'
        run: |
          echo "### Merge-threshold calibration" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m engine.pipeline.calibrate_merge | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Fails loudly if the result is degenerate — one theme swallowing the corpus is how this
      # stage failed silently the first time it ran on real data.
      - name: Cluster
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.merge_at }}" ]; then
            ARGS="--merge-at ${{ github.event.inputs.merge_at }}"
          fi
          echo "### Themes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m engine.pipeline.cluster $ARGS 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Output goes to the step summary, not just the raw log. This stage failed twice with the
      # reason buried ~150 lines up in a job log, which made "why did synthesis produce nothing"
      # far more expensive to answer than it should have been. A credit exhaustion, a rate limit
      # and a bad response shape all look identical from outside; they do not look identical here.
      - name: Synthesize insights
        if: github.event.inputs.skip_synthesis != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "### Synthesis" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          set -o pipefail
          python -m engine.pipeline.synthesize 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          status=$?
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $status

      # Deliberately after synthesis and never skipped: the checks are what license every number
      # the write-up quotes, so they run even if synthesis failed.
      - name: Validate
        if: always()
        run: |
          echo "### Validation" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m engine.validation.checks 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Regenerate the Part 1 write-up
        if: always()
        run: python -m engine.report

      # Generated artifacts, not authored ones — so on a conflict the fresh run always wins.
      #
      # `git pull --rebase` is wrong here and failed exactly once in the obvious way: a local run
      # regenerated themes.json and pushed while this workflow was mid-run, and rebasing a
      # deterministic output file onto a different deterministic output file conflicts every time.
      # There is no merge to perform — one of the two is simply the newer computation.
      #
      # So: move HEAD to the remote tip with the working tree left alone (`reset --mixed`), then
      # re-stage what this run produced. The commit that results is "remote history, plus these
      # outputs", which is what was wanted, and it cannot conflict.
      - name: Commit results
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PATHS="data/processed docs/01-discovery-engine.md"

          git fetch origin ${{ github.ref_name }}
          git reset --mixed FETCH_HEAD          # working tree untouched; index now matches remote
          git add -f $PATHS 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No change to the generated outputs."
          else
            git commit -m "Analyse corpus via Actions run ${{ github.run_number }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
